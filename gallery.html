<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="https://images.fresha.com/locations/location-profile-images/2548421/4603926/609d1c54-d695-4178-ac73-27d5b039cb3a-PimvilleMenkave-ZA-Gauteng-Pimville-PimvilleZone4-Fresha.jpg?class=gallery-modal-small&watermark=true&f_width=640">
    <title>Menkave Gallery</title>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand">Pimville Menkave</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="index.html#booking">Book</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero hero-small">
            <div class="container hero-content">
                <span class="eyebrow">Image Gallery</span>
                <h1>Barber gallery from Pimville Menkave</h1>
                <p>Explore the latest styles, fades, designs, and beard grooming results from Menkave Cape Town.</p>
                <a href="index.html#booking" class="btn btn-primary">Book Your Slot</a>
            </div>
        </section>

        <section class="gallery-section container">
            <div class="gallery-grid">
                <figure class="gallery-card">
                    <img src="Gallery images/Screenshot_14-2-2026_12310_www.instagram.com.jpeg" loading="lazy">
                    <figcaption>Classic fade and precision cut.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="Gallery images/Screenshot_14-4-2026_122837_www.instagram.com.jpeg" alt="Beard trim closeup" loading="lazy">
                    <figcaption>Beard shaping and styling.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="Gallery images/Screenshot_14-1-2026_123155_www.instagram.com.jpeg" loading="lazy">
                    <figcaption>Classic fade and precision cut.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="Gallery images/Screenshot_14-3-2026_122938_www.instagram.com.jpeg" loading="lazy">
                    <figcaption>Colorful hair dyeing fade.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="Gallery images/Screenshot_14-6-2026_13124_www.instagram.com.jpeg" loading="lazy">
                    <figcaption>High taper fade.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="Screenshot_13-4-2026_235628_www.instagram.com.jpeg" loading="lazy">
                    <figcaption>Style consultation for every look.</figcaption>
                </figure>
            </div>
        </section>

        <!-- Image Modal -->
        <div id="image-modal" class="image-modal">
            <span class="image-close">&times;</span>
            <img class="image-modal-content" id="modal-image">
            <div id="image-caption"></div>
        </div>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© 2026 Menkave Barber Shop. Walk-ins welcome, appointments recommended.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" aria-label="Whatsapp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
