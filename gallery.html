<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Menkave Gallery</title>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand">Menkave</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="index.html#booking">Book</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero hero-small">
            <div class="container hero-content">
                <span class="eyebrow">Our work</span>
                <h1>Barber gallery from South Africa</h1>
                <p>Explore the latest styles, fades, designs, and beard grooming results from Menkave Cape Town.</p>
                <a href="index.html#booking" class="btn btn-primary">Book Your Slot</a>
            </div>
        </section>

        <section class="gallery-section container">
            <div class="gallery-grid">
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=800&q=80" alt="Sharp barber haircut" loading="lazy">
                    <figcaption>Classic fade and precision cut.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=800&q=80" alt="Beard trim closeup" loading="lazy">
                    <figcaption>Beard shaping and styling.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Modern barber shop interior" loading="lazy">
                    <figcaption>Modern interior and comfort.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=800&q=80" alt="Barber using tools" loading="lazy">
                    <figcaption>Skilled barbers, premium tools.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1505455184860-5d1b6ffee08e?auto=format&fit=crop&w=800&q=80" alt="Beard grooming" loading="lazy">
                    <figcaption>Clean beard finishes.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80" alt="Style consultation" loading="lazy">
                    <figcaption>Style consultation for every look.</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© 2026 Menkave Barber Shop. Walk-ins welcome, appointments recommended.</p>
            <div class="social-links">
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" aria-label="Whatsapp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
